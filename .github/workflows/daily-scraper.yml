name: Daily Job Scraper

# 언제 실행할지 정의합니다.
on:
  schedule:
    # 매일 한국 시간 오전 9시에 실행 (UTC 시간 기준 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동으로 실행할 수 있는 버튼을 활성화합니다.

# 실행할 작업 내역을 정의합니다.
jobs:
  scrape-and-save:
    runs-on: ubuntu-latest # 최신 리눅스 환경에서 실행

    # 저장소에 쓰기 권한 부여 (CSV 파일 커밋을 위해 필수)
    permissions:
      contents: write

    steps:
      # 1. 내 레포지토리의 코드를 가상 환경으로 가져옵니다.
      - name: 📂 저장소 체크아웃
        uses: actions/checkout@v4

      # 2. 파이썬 환경을 세팅합니다.
      - name: 🐍 Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 크롤링에 필요한 패키지를 설치합니다.
      - name: 📦 requirements.txt 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 크롤링 파이썬 스크립트를 실행합니다. (이때 CSV 파일이 생성됨)
      - name: 🚀 크롤링 스크립트 실행
        run: python scraper.py

      # 5. 생성된 CSV 파일을 레포지토리에 다시 자동 커밋 및 푸시합니다.
      - name: 💾 결과 CSV 파일을 레포지토리에 저장
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 자동 크롤링 업데이트: 신규 채용공고 CSV 저장"
          file_pattern: "*.csv" # 모든 CSV 파일을 커밋 대상으로 지정
